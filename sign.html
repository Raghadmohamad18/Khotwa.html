<!DOCTYPE html><html><head>
      <title>Sign Up</title>
      <style>
         body{
         margin:0;
         background:#F5F5F5;
         font-family:Arial,sans-serif;
         display:flex;
         flex-direction: column;
         justify-content:center; 
         align-items:center;
         min-height:100vh;
         }
         .form{
         background:white;
         width:90%;
         max-width:500px;
         padding:35px;
         border-radius:15px;
         box-shadow:0 5px 15px rgba(0,0,0,.15);
         text-align:center;
         }
         h2{
         color:#1F1F1F;
         margin-bottom:25px;
         }
         input{
         width:100%;
         padding:12px;
         margin:12px 0;
         border:1px solid #ccc;
         border-radius:8px;
         font-size:15px;
         box-sizing:border-box;
         }
         button{
         width:100%;
         height:45px;
         margin-top:15px;
         border:none;
         border-radius:8px;
         background:#C62828;
         color:white;
         font-size:16px;
         font-weight:bold;
         cursor:pointer;
         transition:.3s;
         }
         button:hover{
         background:#388E3C;
         }
         .contact-section{
         width:100%;
         max-width:600px;
         margin:40px auto;
         background:#1F1F1F;
         color:white;
         padding:30px;
         border-radius:15px;
         text-align:center;
         }
         .contact-section h2{
         color:#D4AF37;
         margin-bottom:20px;
         }
         .contact-section p{
         margin:12px 0;
         }
         .contact-section a{
         color:#D4AF37;
         }
      </style>
   </head>
   <body>
      <div class="form">
         <h2>إنشاء حساب</h2>
         <form id="signupForm">
            <input type="text" id="name" placeholder="الاسم بالكامل" required="">
            <input type="email" id="email" placeholder="البريد الالكتروني" required="">
            <input type="password" id="password" placeholder="كلمة المرور" required="">
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required="">
            <button type="submit">إنشاء حساب</button>
         </form>
      </div>
      <section id="contact" class="contact-section">
         <h2> :تواصل معنا</h2>
         <p>📱عبر الهاتف: +201100351797</p>
         <p> :💬عن طريق واتس آب<ahref="https: wa.me="" 201100351797"="">اضغط هنا</ahref="https:></p>
         <p>Khotwa@gmail.com :عن طريق الايميل</p>
      </section>
      <script type="module">
      import { auth, db, authReady } from "./firebase.js";
      import {createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      await authReady;
      const form = document.getElementById("signupForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;
        if (password !== confirmPassword) {
          alert("كلمتا المرور غير متطابقتين");
          return;
        }  
        try {
          const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );
          const uid = result.user.uid;
          await setDoc(doc(db, "users", uid), {
            uid: uid,
            name: name,
            email: email,
            role: "trainee",
            createdAt: serverTimestamp()
          });
          await setDoc(doc(db, "trainees", uid), {
            uid: uid,
            name: name,
            email: email,
            createdAt: serverTimestamp()
          });
          alert("تم إنشاء حساب المتدرب بنجاح");
window.location.href = "trainee_personal.html";
        } catch (error) {
          alert(error.message);
        }
      });
      </script>
</body></html>
