<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>حساب المتدرب </title>
    <link rel="stylesheet" href="khotwa.css">
  </head>
  <body class="trainee-personal-page">
    <div class="container">
      <h1> حساب المتدرب</h1>
      <div class="card">
        <h2 id="name"></h2>
        <p id="email"></p>
        <button id="logout">تسجيل الخروج</button>
      </div>
      <div class="card">
        <h2>طلباتي</h2>
        <div id="requests"></div>
      </div>
      <div class="card">
        <h2>الإشعارات</h2>
        <div id="notifications"></div>
      </div>
      <a href="Khotwa.html"><button>عرض المدربين</button></a>
    </div>
    <script type="module">
      import { auth, db, authReady } from "./firebase.js";
      import { signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {
        doc,
        getDoc,
        collection,
        query,
        where,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      await authReady;
      let stopRequests = null;
      let stopNotifications = null;
      async function startDashboard() {
        const user = auth.currentUser;
        if (!user) {
        alert("سجل الدخول أولًا لعرض ملفك الشخصي");
        window.location.href = "Khotwa.html";
        return;
      }
        const userSnap = await getDoc(doc(db, "users", user.uid));

if (!userSnap.exists() || userSnap.data().role !== "trainee") {
  alert("هذا الحساب ليس حساب متدرب");
  window.location.href = "log.html";
  return;
}

const traineeSnap = await getDoc(doc(db, "trainees", user.uid));

if (!traineeSnap.exists()) {
  alert("بيانات المتدرب غير موجودة");
  return;
}

const trainee = traineeSnap.data();
        document.getElementById("name").textContent = "أهلاً " + (trainee.name || "");
        document.getElementById("email").textContent = trainee.email || user.email || "";
        const requestsQuery = query(collection(db, "requests"), where("traineeId", "==", user.uid));
        stopRequests = onSnapshot(
          requestsQuery,
          (snapshot) => {
            const list = document.getElementById("requests");
            list.innerHTML = "";
            const requests = snapshot.docs;
            if (requests.length === 0) {
              list.textContent = "لم ترسل طلبات حتى الآن";
              return;
            }
            requests.forEach((item) => {
              const data = item.data();
              const card = document.createElement("div");card.className = "card";
              const title = document.createElement("h3");title.textContent = "المدرب: " + (data.coachName || "");
              const status = document.createElement("p");
              if (data.status === "pending") {
                status.textContent = "حالة الطلب: قيد الانتظار";
              } else if (data.status === "accepted") {
                status.textContent = "حالة الطلب: تم القبول";
              } else if (data.status === "declined") {
                status.textContent = "حالة الطلب: تم الرفض";
              }
              card.append(title, status);
              if (data.status === "accepted") {
                const phone = document.createElement("p");
                phone.textContent = "رقم المدرب: " + (data.coachPhone || "غير متاح");
                card.appendChild(phone);
              }
              list.appendChild(card);
            });
          },
          (error) => {
            console.error(error);
            document.getElementById("requests").textContent = "تعذر تحميل الطلبات: " + error.message;
          },
        );
        const notificationsQuery = query(collection(db, "notifications"), where("userId", "==", user.uid));
        stopNotifications = onSnapshot(notificationsQuery, (snapshot) => {
          const list = document.getElementById("notifications");
          list.innerHTML = "";
          const notifications = snapshot.docs;
          if (notifications.length === 0) {
            list.textContent = "لا توجد إشعارات";
            return;
          }
          notifications.forEach((item) => {
            const data = item.data();
            const card = document.createElement("div");
            card.className = "card";
            const title = document.createElement("h3");
            title.textContent = data.title || "إشعار";
            const message = document.createElement("p");
            message.textContent = data.message || "";
            card.append(title, message);
            list.appendChild(card);
          });
        });
      }
      document.getElementById("logout").addEventListener("click", async () => {
        if (stopRequests) stopRequests();
        if (stopNotifications) stopNotifications();
        await signOut(auth);
        window.location.href = "log.html";
      });
      startDashboard().catch((error) => {
        console.error(error);
        alert("تعذر فتح صفحة المتدرب: " + error.message);
      });
    </script>
  </body>
</html>
