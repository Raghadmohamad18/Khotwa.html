
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب المتدرب - SkillMasr</title>

<style>
body {
  font-family: Arial;
  background: #F5F5F5;
  padding: 20px;
}
.container {
  max-width: 850px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}
button {
  background: #C62828;
  color: white;
  padding: 10px 18px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>SkillMasr - حساب المتدرب</h1>

<div class="card">
  <h2 id="name">جاري التحميل...</h2>
  <p id="email"></p>
  <button id="logout">تسجيل الخروج</button>
</div>

<div class="card">
  <h2>My Requests - طلباتي</h2>
  <div id="requests"></div>
</div>

<div class="card">
  <h2>Notifications - الإشعارات</h2>
  <div id="notifications"></div>
</div>

</div>

<script type="module">
<script type="module">
import { auth, db, authReady } from "./firebase.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

await authReady;

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const uid = result.user.uid;

    const userSnap = await getDoc(doc(db, "users", uid));

    if (!userSnap.exists()) {
      alert("بيانات الحساب غير موجودة");
      return;
    }

    const role = userSnap.data().role;

    if (role === "trainee") {
      window.location.href = "trainee_personal.html";
    } else if (role === "coach") {
      window.location.href = "personal.html";
    } else {
      alert("نوع الحساب غير معروف");
    }

  } catch (error) {
    console.error(error);
    alert("تأكدي من البريد الإلكتروني وكلمة المرور");
  }
});
</script>
</body>
</html>
