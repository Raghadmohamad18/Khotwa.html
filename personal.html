<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>your Dashboard</title>
    <style> 
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      body {
        background: #f4f7f6;
        color: #263b36;
        min-height: 100vh;
        padding: 40px 5%;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(2, minmax(280px, 1fr));
        gap: 25px;
        max-width: 1250px;
        margin: auto;
        align-items: start;
      }
      .card {
        background: #fff;
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(31, 75, 63, 0.07);
        border: 1px solid #e7efeb;
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 0;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 9px 25px rgba(31, 75, 63, 0.11);
      }
      .card h2 {
        color: #245b4b;
        font-size: 22px;
        padding-bottom: 14px;
        border-bottom: 2px solid #e8f1ed;
      }
      #coachName {
        font-size: 25px;
        color: #1e5a49;
      }
      #coachEmail,
      #coachSpecialization,
      #coachPrice {
        color: #65766f;
        font-size: 15px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      #coachPrice {
        color: #26765c;
        font-weight: 700;
        font-size: 18px;
      }
      .request {
        background: #f8faf9;
        border: 1px solid #e4ece8;
        border-right: 4px solid #4c9b7b;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-wrap: anywhere;
      }
      .request h3 {
        color: #245b4b;
        font-size: 18px;
      }
      .request p {
        color: #596b64;
        font-size: 14px;
        line-height: 1.7;
      }
      button {
        border: none;
        border-radius: 9px;
        padding: 11px 18px;
        background: #286b55;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        margin-left: 6px;
        margin-top: 5px;
      }
      button:hover {
        background: #194c3b;
        transform: translateY(-2px);
      }      
      #logout {
        background: #b84b4b;
        margin-top: 10px;
        padding: 13px;
      }    
      #logout:hover {
        background: #963737;
      }      
      .whatsapp-link {
        display: inline-block;
        width: fit-content;
        background: #e5f6ec;
        color: #16834a;
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
      }      
      .whatsapp-link:hover {
        background: #c9efd8;
      }      
      #requests,
      #myTrainees,
      #notifications {
        color: #82918b;
        line-height: 1.8;
        font-size: 15px;
      }   
      @media (max-width: 750px) {
        body {
          padding: 25px 15px;
        }   
        .container {
          grid-template-columns: 1fr;
          gap: 18px;
        }   
        .card {
          padding: 22px;
        }    
        .card h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body class="personal-page">
    <div class="container">
      <div class="card">
        <h2 id="coachName"></h2>
        <p id="coachEmail"></p>
        <p id="coachSpecialization"></p>
        <p id="coachPrice"></p>
        <button id="logout">تسجيل الخروج</button>
      </div>
      <div class="card">
        <h2>طلبات المتدربين</h2>
        <div id="requests"></div>
      </div>
      <div class="card">
        <h2> المقبولون</h2>
        <div id="myTrainees"></div>
      </div>
      <div class="card">
        <h2>الإشعارات</h2>
        <div id="notifications"></div>
      </div>
    </div>
    <script type="module">
      import { auth, db, authReady } from "./firebase.js";
      import { signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {
        doc,
        getDoc,
        collection,
        query,
        where,
        onSnapshot,
        updateDoc,
        writeBatch,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      await authReady;
      let stopRequests = null;
      let stopNotifications = null;
      async function startDashboard() {
        const user = auth.currentUser;
        if (!user) {
          window.location.href = "signCoach.html";
          return;
        }
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (!userSnap.exists() || userSnap.data().role !== "coach") {
          alert("هذا الحساب ليس حساب مدرب");
          window.location.href = "log.html";
          return;
        }
        const coachData = await getDoc(doc(db, "coaches", user.uid));
        if (!coachData.exists()) {
          alert("بيانات المدرب غير موجودة");
          return;
        }
        const coach = coachData.data();
        document.getElementById("coachName").textContent = "أهلاً " + (coach.fullName || "");
        document.getElementById("coachEmail").textContent = user.email || "";
        document.getElementById("coachSpecialization").textContent = coach.specialization || "";
        document.getElementById("coachPrice").textContent =
          (coach.price || "") + " جنيه / " + (coach.priceType === "monthly" ? "شهر" : "حصة");
        const requestsQuery = query(collection(db, "requests"), where("coachId", "==", user.uid));
        stopRequests = onSnapshot(
          requestsQuery,
          (snapshot) => {
            const list = document.getElementById("requests");
            const trainees = document.getElementById("myTrainees");
            list.innerHTML = "";
            trainees.innerHTML = "";
            const requests = snapshot.docs.sort((a, b) => {
              const dateA = a.data().createdAt?.toMillis?.() || 0;
              const dateB = b.data().createdAt?.toMillis?.() || 0;
              return dateB - dateA;
            });
            requests.forEach((requestDoc) => {
              const data = requestDoc.data();
              const card = document.createElement("div");
              card.className = "request";
              const title = document.createElement("h3");
              title.textContent = data.traineeName || "متدرب";
              const email = document.createElement("p");
              email.textContent = "البريد: " + (data.traineeEmail || "");
              const goal = document.createElement("p");
              goal.textContent = "الهدف: " + (data.formData?.goal || "");
              const experience = document.createElement("p");
              experience.textContent = "الخبرة: " + (data.formData?.experience || "");
              const time = document.createElement("p");
              time.textContent = "الوقت المناسب: " + (data.formData?.preferredTime || "");
              const notes = document.createElement("p");
              notes.textContent = "ملاحظات: " + (data.formData?.notes || "");
              const status = document.createElement("p");
              status.textContent = "الحالة: " + statusText(data.status);
              card.append(title, email, goal, experience, time, notes, status);
              const phone = (data.formData?.phone || "").replace(/\D/g, "");

if (phone) {
  let whatsappPhone = phone;

  if (whatsappPhone.startsWith("0")) {
    whatsappPhone = "20" + whatsappPhone.slice(1);
  } else if (whatsappPhone.startsWith("1") && whatsappPhone.length === 10) {
    whatsappPhone = "20" + whatsappPhone;
  }

  const whatsapp = document.createElement("a");
  whatsapp.href = `https://wa.me/${whatsappPhone}`;
  whatsapp.target = "_blank";
  whatsapp.rel = "noopener noreferrer";
  whatsapp.textContent = "التواصل مع المتدرب عبر واتساب";
  whatsapp.className = "whatsapp-link";

  card.appendChild(whatsapp);
}
              if (data.status === "pending") {
                const accept = document.createElement("button");
                accept.textContent = "قبول";
                accept.onclick = () => changeStatus(requestDoc.id, data, user.uid, "accepted");
                const decline = document.createElement("button");
                decline.textContent = "رفض";
                decline.onclick = () => changeStatus(requestDoc.id, data, user.uid, "declined");
                card.append(accept, decline);
              }
              if (data.status === "accepted") {
  const traineeCard = document.createElement("div");
  traineeCard.className = "request";

  const traineeInfo = document.createElement("p");
  traineeInfo.textContent =
    (data.traineeName || "متدرب") + " - " + (data.traineeEmail || "");

  const phone = (data.formData?.phone || "").replace(/\D/g, "");

  const phoneInfo = document.createElement("p");
  phoneInfo.textContent = phone
    ? "رقم التواصل: " + (data.formData.phone)
    : "رقم التواصل: غير مسجل";

  traineeCard.append(traineeInfo, phoneInfo);

  if (phone) {
    let whatsappPhone = phone;

    if (whatsappPhone.startsWith("0") && whatsappPhone.length === 11) {
      whatsappPhone = "20" + whatsappPhone.slice(1);
    } else if (whatsappPhone.startsWith("1") && whatsappPhone.length === 10) {
      whatsappPhone = "20" + whatsappPhone;
    }

    const whatsapp = document.createElement("a");
    whatsapp.href = `https://wa.me/${whatsappPhone}`;
    whatsapp.target = "_blank";
    whatsapp.rel = "noopener noreferrer";
    whatsapp.textContent = "التواصل مع المتدرب عبر واتساب";
    whatsapp.className = "whatsapp-link";

    traineeCard.appendChild(whatsapp);
  }

  trainees.appendChild(traineeCard);
}
            if (requests.length === 0) {
              list.textContent = "لا توجد طلبات حتى الآن";
            }
            if (trainees.children.length === 0) {
              trainees.textContent = "لا يوجد متدربون مقبولون حتى الآن";
            }
          },
          (error) => {
            console.error(error);
            document.getElementById("requests").textContent = "تعذر تحميل الطلبات: " + error.message;
          },
        );
        const notificationsQuery = query(collection(db, "notifications"), where("userId", "==", user.uid));
        stopNotifications = onSnapshot(notificationsQuery, (snapshot) => {
          const list = document.getElementById("notifications");
          list.innerHTML = "";
          const notifications = snapshot.docs.sort((a, b) => {
            const dateA = a.data().createdAt?.toMillis?.() || 0;
            const dateB = b.data().createdAt?.toMillis?.() || 0;
            return dateB - dateA;
          });
          if (notifications.length === 0) {
            list.textContent = "لا توجد إشعارات";
            return;
          }
          notifications.forEach((item) => {
            const data = item.data();
            const card = document.createElement("div");
            card.className = "request";
            const title = document.createElement("h3");
            title.textContent = data.title || "إشعار";
            const message = document.createElement("p");
            message.textContent = data.message || "";
            card.append(title, message);
            if (!data.isRead) {
              const button = document.createElement("button");
              button.textContent = "تحديد كمقروء";
              button.onclick = async () => {
                await updateDoc(doc(db, "notifications", item.id), { isRead: true });
              };
              card.appendChild(button);
            }
            list.appendChild(card);
          });
        });
      }
      function statusText(status) {
        if (status === "pending") return "قيد الانتظار";
        if (status === "accepted") return "مقبول";
        if (status === "declined") return "مرفوض";
        return status || "";
      }
      async function changeStatus(requestId, requestData, coachId, status) {
        try {
          const batch = writeBatch(db);
          const requestRef = doc(db, "requests", requestId);
          const notificationRef = doc(collection(db, "notifications"));
          const requestUpdate = {
            status,
            updatedAt: serverTimestamp(),
          };
          if (status === "accepted") {
            const privateSnap = await getDoc(doc(db, "coachPrivate", coachId));
            if (!privateSnap.exists()) {
              alert("بيانات التواصل الخاصة بالمدرب غير موجودة");
              return;
            }
            requestUpdate.coachPhone = privateSnap.data().phone || "";
          }
          batch.update(requestRef, requestUpdate);
          batch.set(notificationRef, {
            userId: requestData.traineeId,
            requestId,
            type: "request_response",
            title: status === "accepted" ? "تم قبول طلبك" : "تم رفض طلبك",
            message: status === "accepted"
              ? "وافق المدرب على طلب التدريب."
              : "المدرب اعتذر عن قبول طلب التدريب.",
            isRead: false,
            createdAt: serverTimestamp(),
          });
          await batch.commit();
          alert(status === "accepted" ? "تم قبول الطلب" : "تم رفض الطلب");
        } catch (error) {
          console.error(error);
          alert("حدث خطأ: " + error.message);
        }
      }
      document.getElementById("logout").addEventListener("click", async () => {
        if (stopRequests) stopRequests();
        if (stopNotifications) stopNotifications();
        await signOut(auth);
        window.location.href = "signCoach.html";
      });
      startDashboard().catch((error) => {
        console.error(error);
        alert("تعذر فتح لوحة المدرب: " + error.message);
      });
    </script>
  </body>
</html>
