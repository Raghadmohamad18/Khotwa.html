<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة تحكم المدرب | خُطوة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        body {
            background: #f5f5f5;
            color: #202020;
            min-height: 100vh;
            padding: 40px 5%;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1250px;
            margin: auto;
            align-items: start;
        }
        .card {
            background: #fff;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
            border: 1px solid #e9e9e9;
            border-top: 5px solid #ce2029;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0;
        }
        .card h2 {
            color: #ce2029;
            font-size: 22px;
            padding-bottom: 14px;
            border-bottom: 2px solid #eee;
        }
        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .profile-item {
            background: #fafafa;
            padding: 12px 15px;
            border-radius: 9px;
            border-right: 3px solid #ce2029;
            overflow-wrap: anywhere;
        }
        .profile-item strong {
            display: block;
            color: #ce2029;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .profile-item span {
            color: #333;
            font-size: 15px;
            line-height: 1.7;
        }
        .request {
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-right: 4px solid #ce2029;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-wrap: anywhere;
        }
        .request h3 {
            font-size: 18px;
            color: #ce2029;
        }
        .request p {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
        }
        button, .contact-link {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            margin: 4px 0;
        }
        .accept {
            background: #ce2029;
            color: white;
        }
        .accept:hover {
            background: #a71921;
        }
        .reject {
            background: #333;
            color: white;
        }
        .reject:hover {
            background: #111;
        }
        .call {
            background: #e8efff;
            color: #2456a5;
        }
        .whatsapp {
            background: #e5f6ec;
            color: #16834a;
        }
        #logout {
            background: #ce2029;
            color: white;
            width: 100%;
            padding: 13px;
        }
        .empty {
            color: #888;
            font-size: 14px;
            padding: 10px 0;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .actions button {
            flex: 1;
        }
        @media (max-width: 750px) {
            body {
                padding: 25px 15px;
            }
            .container {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>بيانات المدرب</h2>
            <div id="coachDetails" class="profile-info">
                جاري تحميل البيانات...
            </div>
            <button id="logout">تسجيل الخروج</button>
        </div>
        <div class="card">
            <h2>طلبات المتدربين</h2>
            <div id="requests">جاري تحميل الطلبات...</div>
        </div>
        <div class="card">
            <h2>المتدربون المقبولون</h2>
            <div id="myTrainees">جاري تحميل البيانات...</div>
        </div>
    </div>
    <script type="module">
        import { auth, db, authReady } from "./firebase.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
        import {
            doc,
            getDoc,
            collection,
            query,
            where,
            onSnapshot,
            updateDoc,
            deleteDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
        await authReady;
        let stopRequests = null;
        function createText(tag, text) {
            const element = document.createElement(tag);
            element.textContent = text;
            return element;
        }
        function addProfileField(container, label, value) {
            if (value === null || value === undefined || value === "") return;
            if (typeof value === "object" && !Array.isArray(value)) return;
            const item = document.createElement("div");
            item.className = "profile-item";
            const title = createText("strong", label);
            const content = createText("span", Array.isArray(value) ? value.join("، ") : String(value));
            item.append(title, content);
            container.appendChild(item);
        }
        function fieldName(key) {
            const names = {
                fullName: "الاسم بالكامل",
                name: "الاسم",
                email: "البريد الإلكتروني",
                phone: "رقم التليفون",
                specialization: "التخصص",
                category: "المجال",
                price: "السعر",
                experience: "الخبرة",
                governorate: "المحافظة",
                city: "المدينة",
                address: "العنوان",
                bio: "نبذة عن المدرب",
                description: "الوصف",
                certificate: "الشهادة",
                certificates: "الشهادات",
                workplace: "مكان العمل",
                availability: "المواعيد المتاحة",
                online: "التدريب أونلاين"
            };
            return names[key] || key;
        }
        function showCoachDetails(coach, user) {
            const container = document.getElementById("coachDetails");
            container.innerHTML = "";
            const excluded = [
                "password",
                "confirmPassword",
                "confirm_password",
                "uid",
                "userId",
                "role",
                "createdAt",
                "updatedAt"
            ];
            Object.entries(coach).forEach(([key, value]) => {
                if (excluded.includes(key) || key.toLowerCase().includes("password")) return;
                addProfileField(container, fieldName(key), value);
            });
            if (user.email && !coach.email) {
                addProfileField(container, "البريد الإلكتروني", user.email);
            }
            if (container.children.length === 0) {
                container.textContent = "لا توجد بيانات مسجلة";
            }
        }
        function normalizePhone(phone) {
            let number = String(phone || "").replace(/\D/g, "");
            if (number.startsWith("00")) {
                number = number.slice(2);
            }
            if (number.startsWith("0")) {
                number = "20" + number.slice(1);
            }
            return number;
        }
        function createRequestCard(requestDoc) {
            const data = requestDoc.data();
            const form = data.formData || {};
            const card = document.createElement("div");
            card.className = "request";
            card.append(
                createText("h3", data.traineeName || "متدرب"),
                createText("p", "رقم التواصل: " + (form.phone || "غير متاح")),
                createText("p", "هدف التدريب: " + (form.goal || "غير محدد")),
                createText("p", "مستوى الخبرة: " + (form.experience || "غير محدد")),
                createText("p", "منطقة السكن: " + (form.governorate || "غير محددة")),
                createText("p", "الوقت المناسب: " + (form.preferredTime || "غير محدد")),
                createText("p", "ملاحظات إضافية: " + (form.notes || "لا توجد"))
            );
            const actions = document.createElement("div");
            actions.className = "actions";
            const accept = document.createElement("button");
            accept.className = "accept";
            accept.textContent = "قبول الطلب";
            accept.onclick = async () => {
                accept.disabled = true;
                try {
                    await updateDoc(doc(db, "requests", requestDoc.id), {
                        status: "accepted",
                        updatedAt: serverTimestamp()
                    });
                    alert("تم قبول الطلب بنجاح");
                } catch (error) {
                    console.error(error);
                    alert("تعذر قبول الطلب: " + error.message);
                    accept.disabled = false;
                }
            };
            const reject = document.createElement("button");
            reject.className = "reject";
            reject.textContent = "رفض الطلب";
            reject.onclick = async () => {
                if (!confirm("هل أنت متأكد من رفض وحذف هذا الطلب؟")) return;
                reject.disabled = true;
                try {
                    await deleteDoc(doc(db, "requests", requestDoc.id));
                    alert("تم حذف الطلب");
                } catch (error) {
                    console.error(error);
                    alert("تعذر حذف الطلب: " + error.message);
                    reject.disabled = false;
                }
            };
            actions.append(accept, reject);
            card.appendChild(actions);
            return card;
        }
        function createTraineeCard(requestDoc) {
            const data = requestDoc.data();
            const form = data.formData || {};
            const phone = form.phone || "";
            const card = document.createElement("div");
            card.className = "request";
            card.append(
                createText("h3", data.traineeName || "متدرب"),
                createText("p", "رقم التواصل: " + (phone || "غير متاح")),
                createText("p", "هدف التدريب: " + (form.goal || "غير محدد")),
                createText("p", "مستوى الخبرة: " + (form.experience || "غير محدد")),
                createText("p", "منطقة السكن: " + (form.governorate || "غير محددة")),
                createText("p", "الوقت المناسب: " + (form.preferredTime || "غير محدد"))
