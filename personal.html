<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>your Dashboard</title>
    <link rel="stylesheet" href="khotwa.css">
  </head>
  <body class="personal-page">
    <div class="container">
      <div class="card">
        <h2 id="coachName"></h2>
        <p id="coachEmail"></p>
        <p id="coachSpecialization"></p>
        <p id="coachPrice"></p>
        <button id="logout">تسجيل الخروج</button>
      </div>
      <div class="card">
        <h2>طلبات المتدربين</h2>
        <div id="requests"></div>
      </div>
      <div class="card">
        <h2> المقبولون</h2>
        <div id="myTrainees"></div>
      </div>
    </div>
    <script type="module">
      import { auth, db, authReady } from "./firebase.js";
      import { signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {
        doc,
        getDoc,
        collection,
        query,
        where,
        onSnapshot,
        updateDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      await authReady;
      let stopRequests = null;
      async function startDashboard() {
        const user = auth.currentUser;
        if (!user) {
          window.location.href = "signCoach.html";
          return;
        }
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (!userSnap.exists() || userSnap.data().role !== "coach") {
          alert("هذا الحساب ليس حساب مدرب");
          window.location.href = "log.html";
          return;
        }
        const coachData = await getDoc(doc(db, "coaches", user.uid));
        if (!coachData.exists()) {
          alert("بيانات المدرب غير موجودة");
          return;
        }
        const coach = coachData.data();
        document.getElementById("coachName").textContent = "أهلاً " + (coach.fullName || "");
        document.getElementById("coachEmail").textContent = user.email || "";
        document.getElementById("coachSpecialization").textContent = coach.specialization || "";
        document.getElementById("coachPrice").textContent =
          (coach.price || "") + " جنيه / " + (coach.priceType === "monthly" ? "شهر" : "حصة");
        const requestsQuery = query(collection(db, "requests"), where("coachId", "==", user.uid));
        stopRequests = onSnapshot(
          requestsQuery,
          (snapshot) => {
            const list = document.getElementById("requests");
            const trainees = document.getElementById("myTrainees");
            list.innerHTML = "";
            trainees.innerHTML = "";
            const requests = snapshot.docs.sort((a, b) => {
              const dateA = a.data().createdAt?.toMillis?.() || 0;
              const dateB = b.data().createdAt?.toMillis?.() || 0;
              return dateB - dateA;
            });
            requests.forEach((requestDoc) => {
              const data = requestDoc.data();
              const card = document.createElement("div");
              card.className = "request";
              const title = document.createElement("h3");
              title.textContent = data.traineeName || "متدرب";
              const goal = document.createElement("p");
              goal.textContent = "الهدف: " + (data.formData?.goal || "");
              const experience = document.createElement("p");
              experience.textContent = "الخبرة: " + (data.formData?.experience || "");
              const time = document.createElement("p");
              time.textContent = "الوقت المناسب: " + (data.formData?.preferredTime || "");
              const notes = document.createElement("p");
              notes.textContent = "ملاحظات: " + (data.formData?.notes || "");
              const status = document.createElement("p");
              status.textContent = "الحالة: " + statusText(data.status);
              const governorate = document.createElement("p");
governorate.textContent = "المحافظة: " + (data.formData?.governorate || "");
card.append(title, governorate, goal, experience, time, notes, status);
              const phone = (data.formData?.phone || "").replace(/\D/g, "");
                if (phone) {
                  const whatsappPhone = phone.startsWith("0")
                    ? "20" + phone.slice(1)
                    : phone;
                
                  const whatsapp = document.createElement("a");
                  whatsapp.href = `https://wa.me/${whatsappPhone}`;
                  whatsapp.target = "_blank";
                  whatsapp.rel = "noopener noreferrer";
                  whatsapp.textContent = "التواصل مع المتدرب عبر واتساب";
                  whatsapp.className = "whatsapp-link";
                
                  card.appendChild(whatsapp);
                }
              if (data.status === "pending") {
                const accept = document.createElement("button");
                accept.textContent = "قبول";
                accept.onclick = () => changeStatus(requestDoc.id, data, user.uid, "accepted");
                const decline = document.createElement("button");
                decline.textContent = "رفض";
                decline.onclick = () => changeStatus(requestDoc.id, data, user.uid, "declined");
                card.append(accept, decline);
              }
              if (data.status === "accepted") {
                const traineeCard = document.createElement("div");
traineeCard.className = "request";

const traineeInfo = document.createElement("p");
traineeInfo.textContent = data.traineeName || "متدرب";
traineeCard.appendChild(traineeInfo);

const phone = (data.formData?.phone || "").replace(/\D/g, "");

if (phone) {
  const whatsappPhone = phone.startsWith("0")
    ? "20" + phone.slice(1)
    : phone;

  const whatsapp = document.createElement("a");
  whatsapp.href = `https://wa.me/${whatsappPhone}`;
  whatsapp.target = "_blank";
  whatsapp.rel = "noopener noreferrer";
  whatsapp.textContent = "التواصل عبر واتساب";
  whatsapp.className = "whatsapp-link";

  traineeCard.appendChild(whatsapp);
}

trainees.appendChild(traineeCard);
              }
              list.appendChild(card);
            });
            if (requests.length === 0) {
              list.textContent = "لا توجد طلبات حتى الآن";
            }
            if (trainees.children.length === 0) {
              trainees.textContent = "لا يوجد متدربون مقبولون حتى الآن";
            }
          },
                    (error) => {
            console.error(error);
            document.getElementById("requests").textContent =
              "تعذر تحميل الطلبات: " + error.message;
          }
        );
      }
      function statusText(status) {
        if (status === "pending") return "قيد الانتظار";
        if (status === "accepted") return "مقبول";
        if (status === "declined") return "مرفوض";
        return status || "";
      }
async function changeStatus(requestId, requestData, coachId, status) {
  try {
    await updateDoc(doc(db, "requests", requestId), {
      status,
      updatedAt: serverTimestamp()
    });

    alert(status === "accepted" ? "تم قبول الطلب" : "تم رفض الطلب");
  } catch (error) {
    console.error(error);
    alert("حدث خطأ: " + error.message);
  }
}
      document.getElementById("logout").addEventListener("click", async () => {
        if (stopRequests) stopRequests();
        await signOut(auth);
        window.location.href = "signCoach.html";
      });
      startDashboard().catch((error) => {
        console.error(error);
        alert("تعذر فتح لوحة المدرب: " + error.message);
      });
    </script>
  </body>
</html>
