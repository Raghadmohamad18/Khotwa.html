
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Dashboard - SkillMasr</title>

<style>
body {
  font-family: Arial;
  background: #F5F5F5;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  margin: 18px 0;
  border-radius: 12px;
  box-shadow: 0 3px 12px #ddd;
}
button {
  background: #C62828;
  color: white;
  border: 0;
  padding: 10px 18px;
  border-radius: 7px;
  cursor: pointer;
  margin: 5px;
}
button:hover {
  background: #A00000;
}
.request {
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 9px;
  margin: 12px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>SkillMasr - لوحة المدرب</h1>

<div class="card">
  <h2 id="coachName">جاري التحميل...</h2>
  <p id="coachEmail"></p>
  <p id="coachSpecialization"></p>
  <p id="coachPrice"></p>
  <button id="logout">تسجيل الخروج</button>
</div>

<div class="card">
  <h2>إحصائيات التدريب</h2>
  <p>كل الطلبات: <span id="total">0</span></p>
  <p>طلبات جديدة: <span id="pending">0</span></p>
  <p>المتدربون المقبولون: <span id="accepted">0</span></p>
</div>

<div class="card">
  <h2>طلبات المتدربين والفورمز</h2>
  <div id="requests">جاري تحميل الطلبات...</div>
</div>

<div class="card">
  <h2>My Trainees - المتدربون المقبولون</h2>
  <div id="myTrainees"></div>
</div>

<div class="card">
  <h2>الإشعارات</h2>
  <div id="notifications"></div>
</div>

</div>
<script type="module">
import { auth, db, authReady } from "./firebase.js";

import {
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  getDoc,
  collection,
  query,
  where,
  onSnapshot,
  updateDoc,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

await authReady;

let stopRequests = null;
let stopNotifications = null;

async function startDashboard() {
  const user = auth.currentUser;

  if (!user) {
    window.location.href = "signCoach.html";
    return;
  }

  const userSnap = await getDoc(doc(db, "users", user.uid));

  if (!userSnap.exists() || userSnap.data().role !== "coach") {
    alert("هذا الحساب ليس حساب مدرب");
    window.location.href = "log.html";
    return;
  }

  const coachSnap = await getDoc(doc(db, "coaches", user.uid));

  if (!coachSnap.exists()) {
    alert("بيانات المدرب غير موجودة");
    return;
  }

  const coach = coachSnap.data();

  document.getElementById("coachName").textContent =
    "أهلاً " + (coach.fullName || "");

  document.getElementById("coachEmail").textContent =
    user.email || "";

  document.getElementById("coachSpecialization").textContent =
    coach.specialization || "";

  document.getElementById("coachPrice").textContent =
    (coach.price || "") + " جنيه / " +
    (coach.priceType === "monthly" ? "شهر" : "حصة");

  // طلبات المدرب
  const requestsQuery = query(
    collection(db, "requests"),
    where("coachId", "==", user.uid)
  );

  stopRequests = onSnapshot(requestsQuery, snapshot => {
    const list = document.getElementById("requests");
    const trainees = document.getElementById("myTrainees");

    list.innerHTML = "";
    trainees.innerHTML = "";

    let pending = 0;
    let accepted = 0;

    document.getElementById("total").textContent = snapshot.size;

    const requests = snapshot.docs.sort((a, b) => {
      const dateA = a.data().createdAt?.toMillis?.() || 0;
      const dateB = b.data().createdAt?.toMillis?.() || 0;
      return dateB - dateA;
    });

    requests.forEach(requestDoc => {
      const data = requestDoc.data();

      const card = document.createElement("div");
      card.className = "request";

      const title = document.createElement("h3");
      title.textContent = data.traineeName || "متدرب";

      const email = document.createElement("p");
      email.textContent = "البريد: " + (data.traineeEmail || "");

      const goal = document.createElement("p");
      goal.textContent = "الهدف: " + (data.formData?.goal || "");

      const experience = document.createElement("p");
      experience.textContent =
        "الخبرة: " + (data.formData?.experience || "");

      const time = document.createElement("p");
      time.textContent =
        "الوقت المناسب: " + (data.formData?.preferredTime || "");

      const notes = document.createElement("p");
      notes.textContent =
        "ملاحظات: " + (data.formData?.notes || "");

      const status = document.createElement("p");
      status.textContent =
        "الحالة: " + statusText(data.status);

      card.append(title, email, goal, experience, time, notes, status);

      if (data.status === "pending") {
        pending++;

        const accept = document.createElement("button");
        accept.textContent = "قبول";

        accept.onclick = () =>
          changeStatus(requestDoc.id, data, user.uid, "accepted");

        const decline = document.createElement("button");
        decline.textContent = "رفض";

        decline.onclick = () =>
          changeStatus(requestDoc.id, data, user.uid, "declined");

        card.append(accept, decline);
      }

      if (data.status === "accepted") {
        accepted++;

        const traineeCard = document.createElement("div");
        traineeCard.className = "request";
        traineeCard.textContent =
          (data.traineeName || "متدرب") + " - " +
          (data.traineeEmail || "");

        trainees.appendChild(traineeCard);
      }

      list.appendChild(card);
    });

    document.getElementById("pending").textContent = pending;
    document.getElementById("accepted").textContent = accepted;

    if (requests.length === 0) {
      list.textContent = "لا توجد طلبات حتى الآن";
    }

    if (trainees.children.length === 0) {
      trainees.textContent = "لا يوجد متدربون مقبولون حتى الآن";
    }

  }, error => {
    console.error(error);
    document.getElementById("requests").textContent =
      "تعذر تحميل الطلبات: " + error.message;
  });

  // إشعارات المدرب
  const notificationsQuery = query(
    collection(db, "notifications"),
    where("userId", "==", user.uid)
  );

  stopNotifications = onSnapshot(notificationsQuery, snapshot => {
    const list = document.getElementById("notifications");
    list.innerHTML = "";

    const notifications = snapshot.docs.sort((a, b) => {
      const dateA = a.data().createdAt?.toMillis?.() || 0;
      const dateB = b.data().createdAt?.toMillis?.() || 0;
      return dateB - dateA;
    });

    if (notifications.length === 0) {
      list.textContent = "لا توجد إشعارات";
      return;
    }

    notifications.forEach(item => {
      const data = item.data();

      const card = document.createElement("div");
      card.className = "request";

      const title = document.createElement("h3");
      title.textContent = data.title || "إشعار";

      const message = document.createElement("p");
      message.textContent = data.message || "";

      card.append(title, message);

      if (!data.isRead) {
        const button = document.createElement("button");
        button.textContent = "تحديد كمقروء";

        button.onclick = async () => {
          await updateDoc(
            doc(db, "notifications", item.id),
            { isRead: true }
          );
        };

        card.appendChild(button);
      }

      list.appendChild(card);
    });
  });
}

function statusText(status) {
  if (status === "pending") return "قيد الانتظار";
  if (status === "accepted") return "مقبول";
  if (status === "declined") return "مرفوض";
  return status || "";
}

async function changeStatus(requestId, requestData, coachId, status) {
  try {
    const privateSnap = await getDoc(
      doc(db, "coachPrivate", coachId)
    );

    if (!privateSnap.exists()) {
      alert("بيانات التواصل الخاصة بالمدرب غير موجودة");
      return;
    }

    const batch = writeBatch(db);

    const requestRef = doc(db, "requests", requestId);
    const notificationRef = doc(collection(db, "notifications"));

    const requestUpdate = {
      status,
      updatedAt: serverTimestamp()
    };

    if (status === "accepted") {
      requestUpdate.coachPhone = privateSnap.data().phone || "";
    }

    batch.update(requestRef, requestUpdate);

    batch.set(notificationRef, {
      userId: requestData.traineeId,
      requestId,
      type: "request_response",
      title: status === "accepted" ? "تم قبول طلبك" : "تم رفض طلبك",
      message: status === "accepted"
        ? "وافق المدرب على طلب التدريب. يمكنك رؤية بيانات التواصل في صفحتك."
        : "المدرب اعتذر عن قبول طلب التدريب.",
      isRead: false,
      createdAt: serverTimestamp()
    });

    await batch.commit();

    alert(status === "accepted" ? "تم قبول الطلب" : "تم رفض الطلب");

  } catch (error) {
    console.error(error);
    alert("حدث خطأ: " + error.message);
  }
}

document.getElementById("logout").addEventListener("click", async () => {
  if (stopRequests) stopRequests();
  if (stopNotifications) stopNotifications();

  await signOut(auth);
  window.location.href = "signCoach.html";
});

startDashboard().catch(error => {
  console.error(error);
  alert("تعذر فتح لوحة المدرب: " + error.message);
});
</script>
</body>
</html>
