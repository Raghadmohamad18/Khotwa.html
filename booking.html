<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز تدريب</title>
    <link rel="stylesheet" href="khotwa.css">
  </head>
  <body class="booking-page">
    <div class="form-box">
      <form id="requestForm">
        <h2>طلب حجز مع المدرب</h2>
        <p id="coachName">جاري تحميل اسم المدرب...</p>
        <label>اسمك</label>
        <input id="traineeName" type="text" placeholder="اكتب اسمك" required>
        <label>البريد الإلكتروني</label>
        <input id="traineeEmail" type="email" placeholder="اكتب إيميلك" required>
        <label>كلمة المرور</label>
        <input id="password" type="password" minlength="6" placeholder="كلمة المرور" required>
        <label>تأكيد كلمة المرور</label>
        <input id="confirmPassword" type="password" minlength="6" placeholder="تأكيد كلمة المرور" required>
        <label>رقم التواصل</label>
        <input id="num" type="tel" placeholder="اكتب الرقم" required>
        <label>هدفك من التدريب</label>
        <textarea id="goal" placeholder="اكتب هدفك من التدريب" required></textarea>
        <label>مستوى خبرتك</label>
        <select id="experience" required>
          <option value="">اختار مستواك</option>
          <option value="Beginner">مبتدئ</option>
          <option value="Intermediate">متوسط</option>
          <option value="Advanced">متقدم</option>
        </select>
        <label>منطقة السكن</label>
        <input id="gov" type="text" placeholder="اكتب المنطقة" required>
        <label>الوقت المناسب ليك</label>
        <input id="preferredTime" type="text" placeholder="مثلاً السبت والثلاثاء مساءً" required>
        <label>ملاحظات إضافية</label>
        <textarea id="notes" placeholder="اختياري"></textarea>
        <button type="submit">إرسال الطلب</button>
      </form>
    </div>
    <script type="module" src="booking.js"></script>
  </body>
</html>
