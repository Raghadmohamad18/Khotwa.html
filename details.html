<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل عن المدرب</title>
    <link rel="stylesheet" href="khotwa.css">
  </head>
  <body class="details-page">
    <div class="card">
      <h1 id="name"></h1>
      <img id="img" alt="coach image" />
      <h3 id="sport"></h3>
      <p>
        <b>:المكان</b>
        <span id="area"></span>
      </p>
      <p>
        <b>:السعر</b>
        <span id="price"></span>
      </p>
      <p id="about"></p>
      <h2>مكان التدريب</h2>
      <div id="places"></div>
      <h2>الشهادات الحاصل عليها المدرب</h2>
      <ul id="certs"></ul>
      <br />
      
<button id="bookBtn" type="button">احجز الآن</button>
      <button onclick="history.back()">العودة</button>
    </div>
    <script type="module" src="details.js"></script>
  </body>
</html>
