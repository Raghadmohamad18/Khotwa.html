<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Log in</title>
      <style>
         body{
         margin:0;
         font-family:Arial,sans-serif;
         background:#f5f5f5;
         align-items:center;
         display:flex;
         flex-direction:column;
         }
         .form{
         background:white;
         width:100%;
         max-width:600px;
         padding:30px;
         border-radius:15px;
         box-shadow:0 8px 20px rgba(0,0,0,.15);
         margin-top:50px;
         }
         .form h1,
         .form h3{
         text-align:center;
         }
         label{
         display:block;
         text-align:left;
         margin-top:15px;
         margin-bottom:6px;
         font-weight:bold;
         color:#333;
         }
         input{
         width:100%;
         padding:12px;
         border:1px solid #ccc;
         border-radius:8px;
         font-size:15px;
         }
         button{
         width:100%;
         margin-top:25px;
         padding:14px;
         border:none;
         border-radius:8px;
         background:#C62828;
         color:white;
         font-size:16px;
         font-weight:bold;
         }
         button:hover{
         background:#388E3C;
         }
         .sign{
         margin-top:20px;
         text-align:center;
         }
         .sign p{
         color:#444;
         }
         .sign a{
         color:#D4AF37;
         text-decoration:none;
         font-weight:bold;
         }
         .contact-section{
         width:100%;
         max-width:600px;
         margin:40px auto;
         background:#1F1F1F;
         color:white;
         padding:30px;
         border-radius:15px;
         text-align:center;
         }
         .contact-section h2{
         color:#D4AF37;
         margin-bottom:20px;
         }
         .contact-section p{
         margin:12px 0;
         }
         .contact-section a{
         color:#D4AF37;
         }
      </style>
   </head>
   <body>
      <div class="form">
         <h1>تسجيل الدخول</h1>
         <h3><em>!اهلا بك مجددًا</em></h3>
         <form id="loginForm">
            <label>البريد الالكتروني</label>
            <input type="email" id="email" placeholder="ادخله هنا" required>
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="ادخلها هنا" required>
            <button type="submit">تسجيل الدخول</button>
         </form>
      </div>
      <div class="sign">
         <p>ليس لديك حساب</p>
         <a href="sign.html"><em>إنشاء حساب</em></a>
      </div>
      <section id="contact" class="contact-section">
         <h2> :تواصل معنا</h2>
         <p>📱عبر الهاتف: +201100351797</p>
         <p> :💬عن طريق واتس آب<ahref="https://wa.me/201100351797">اضغط هنا</a></p>
         <p>skillmasr@gmail.com :عن طريق الايميل</p>
      </section>     
      <script type="module">
      import { auth, db, authReady } from "./firebase.js";
      import {
        signInWithEmailAndPassword
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {
        doc,
        getDoc
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      await authReady;
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        try {
          const result = await signInWithEmailAndPassword(auth, email, password);
          const userSnap = await getDoc(doc(db, "users", result.user.uid));
          if (!userSnap.exists()) {
            alert("بيانات الحساب غير موجودة");
            return;
          }
          const role = userSnap.data().role;
          if (role === "trainee") {
            const pendingCoachId = sessionStorage.getItem("pendingCoachId");
            if (pendingCoachId) {
              sessionStorage.removeItem("pendingCoachId");
              window.location.href =
                "details.html?id=" + encodeURIComponent(pendingCoachId);
            } else {
              window.location.href = "trainee_personal.html";
            }
          } else if (role === "coach") {
            window.location.href = "personal.html";
          } else {
            alert("نوع الحساب غير معروف");
          }
        } catch (error) {
          console.error(error);
          alert("تأكدي من البريد الإلكتروني وكلمة المرور");
        }
      });
      </script>
   </body>
</html>
